name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            prototype/package-lock.json
      - name: Check documentation changes at PR head
        if: github.event_name == 'pull_request'
        env:
          DOCS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run check:docs -- --base "$DOCS_BASE_SHA"
      - name: Install workspace dependencies
        run: npm ci
      - name: Install prototype dependencies
        run: npm --prefix prototype ci
      - name: Validate workspace
        run: npm run ci
