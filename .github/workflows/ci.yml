name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            prototype/package-lock.json
      - name: Install workspace dependencies
        run: npm ci
      - name: Install prototype dependencies
        run: npm --prefix prototype ci
      - name: Validate workspace
        run: npm run ci
